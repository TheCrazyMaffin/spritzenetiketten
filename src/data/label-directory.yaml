$schema: label-directory.schema.json
partials:
  base:
    roundedEdges: 5
    borderSides:
      top: true
      right: true
      bottom: true
      left: true
  base:small:
    layout: small
    aspectRatio: 3
  base:large:
    layout: large
    aspectRatio: 2.5
    borderSides:
      bottom: false
  base:add-on:
    layout: add-on
    aspectRatio: 2.5
  base:line:
    layout: line
    aspectRatio: 4.5

  group:Antiarrhythmika:
    backgroundFill:
      bottomLeftHalf: rgb(191, 18, 56)
      topRightHalf: rgb(0, 140, 204)
    textBackgroundFill:
      solid: white

  group:Anticholinergika:
    backgroundFill:
      solid: rgb(163, 217, 99)
    textBackgroundFill:
      solid: black

  group:Antiemetika:
    backgroundFill:
      solid: rgb(237, 194, 130)
    textBackgroundFill:
      solid: black

  group:Antikoagulanzien:
    backgroundFill:
      solid: rgb(207, 201, 196)
    borderFill:
      solid: black
    borderSize: 3
    textBackgroundFill:
      solid: black

  group:Antikonvulsiva:
    backgroundFill:
      bottomLeftHalf: rgb(99, 107, 112)
      topRightHalf: rgb(186, 31, 181)
    textBackgroundFill:
      solid: white

  group:Benzodiazepin-Antagonisten:
    borderFill:
      hatch135deg: rgb(255, 102, 0)
    borderSize: 5
    textBackgroundFill:
      solid: black

  group:Benzodiazepine:
    backgroundFill:
      solid: rgb(255, 102, 0)
    textBackgroundFill:
      solid: black
      
  group:Bronchodilatatoren:
    backgroundFill:
      bottomLeftHalf: rgb(41, 5, 161)
      topRightHalf: rgb(130, 89, 31)
    textBackgroundFill:
      solid: white
      
  group:Cholinergika:
    borderFill:
      hatch135deg: rgb(163, 217, 99)
    borderSize: 5
    textBackgroundFill:
      solid: black

  group:Elektrolyte:
    backgroundFill:
      bottomLeftHalf: rgb(0,99, 56)
      topRightHalf: rgb(171, 3, 92)
    textBackgroundFill:
      solid: white

  group:Hormone:
    backgroundFill:
      bottomLeftHalf: rgb(112, 51, 31)
      topRightHalf: rgb(217, 204, 97)
    textBackgroundFill:
      solid: white

  group:Hypnotika:
    backgroundFill:
      solid: rgb(255, 255, 0)
    textBackgroundFill:
      solid: black

  group:Inodilatatoren:
    backgroundFill:
      bottomLeftHalf: rgb(191, 18, 56)
      topRightHalf: rgb(99, 204, 150)
    textBackgroundFill:
      solid: white

  group:Koagulanzien:
    backgroundFill:
      solid: rgb(207, 201, 196)
    borderFill:
      hatch135deg: black
    borderSize: 5
    textBackgroundFill:
      solid: black

  group:Lokalanästhetika:
    backgroundFill:
      solid: rgb(194, 184, 171)
    textBackgroundFill:
      solid: black

  group:Muskelrelaxans-Antagonisten:
    borderFill:
      hatch135deg: rgb(245, 64, 41)
    borderSize: 5
    midline: black
    textBackgroundFill:
      solid: black

  group:Muskelrelaxanzien:
    backgroundFill:
      bottomHalf: rgb(245, 64, 41)
    textBackgroundFill:
      solid: black

  group:Opioid-Antagonisten:
    borderFill:
      hatch135deg: rgb(133, 199, 226)
    borderSize: 5
    textBackgroundFill:
      solid: black

  group:Opioide:
    backgroundFill:
      solid: rgb(133, 199, 226)
    textBackgroundFill:
      solid: black

  group:Sonstige:
    backgroundFill:
      solid: null
    textBackgroundFill:
      solid: black

  group:Vasodilatatoren:
    borderFill:
      hatch135deg: rgb(222, 191, 217)
    borderSize: 5
    textBackgroundFill:
      solid: black

  group:Vasopressoren:
    backgroundFill:
      solid: rgb(222, 191, 217)
    textBackgroundFill:
      solid: black
      
  override:Suxamethonium:
    backgroundFill:
      topHalf: black
    textBackgroundFill:
      topHalf: white

  override:Epinephrin:
    backgroundFill:
      topHalf: black
    textBackgroundFill:
      topHalf: rgb(222, 191, 217)

  override:Alteplase:
    textBackgroundFill:
      solid: rgb(245, 64, 41)

  override:Heparin:
    backgroundFill:
      solid: null

  override:Kalium:
    backgroundFill:
      topRightHalf: rgb(0, 140, 204)

  override:NaCl:
    backgroundFill:
      solid: rgb(0, 99, 56)
      topRightHalf: null
      bottomLeftHalf: null

  override:Insulin:
    backgroundFill:
      topRightHalf: rgb(245, 232, 20)
    textBackgroundFill:
      topRightHalf: rgb(112, 51, 31)
